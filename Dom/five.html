        <li>Javascript</li>

<script>
    // function addLanguage(langName){
    //     const li =  document.createElement('li');
    //     li.innerHTML = `${langName}`;
    //     document.querySelector('.language').appendChild(li);
    // }

    // addLanguage('React.js')

    // --------------------optimize approach --------------

    function addOtiLanguage(langName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li)
    }
    addOtiLanguage('Node.js')
    addOtiLanguage('React.js')
    addOtiLanguage('MongoDB')

    // --------------Edit---------------

    const new1 = document.querySelector('li:nth-child(2)');
    new1.innerHTML = 'C++'

    const li = document.querySelector('li:first-child');
    li.outerHTML = '<li>typeScript</li>'

    // ---------------Remove--------------

    const removeNew = document.querySelector("li:nth-child(2)");
    removeNew.remove()


</script>
