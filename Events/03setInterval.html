<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1 id="name">Aman + react</h1>
        <button id="start">Start</button>
        <button id="stop">Stop</button>
    </div>
</body>
<script>

    

    const value = document.querySelector("#start").addEventListener("click" , (e)=>{
        setInterval(()=>{
            document.querySelector("#name").innerHTML = "Hii Aman whatsapp"

        },2000)   
        
    })

    document.querySelector("#stop").addEventListener("click" , ()=>{
        clearInterval(value)
    })



</script>
</html>
