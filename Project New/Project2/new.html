<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .container{
        width: 100%;
        height: 100vh;
        
    }
    .calculator{
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        background-color: #e2eff3 ;
    }
    .calculator form{
        padding: 15px;
        background-color: rgb(96, 112, 123);
       
    }
    .calculator form input{
        padding: 10px;
        width: 50px;
        height: 50px;
        border-radius: 10px;
        box-shadow: -8px -8px 15px rgba(237, 238, 239, 0.3), 5px 5px 15px rgba(192, 196, 208, 0.3);;
        background: transparent;
        margin: 2px;
        color: #fff;
    }
    .display{
        display: flex;
        justify-content: center;
        margin: 10px 0;

    }
    form .display input{
        text-align: right;
        font-size: 45px;
        flex: 1px;
        background-color: rgb(167, 209, 195);
    }
    form input.equal{
       width: 110px;
    }



</style>
<body>
    <div class="container">
        <div class="calculator">
            <form action="">
                <div class="display">
                    <input type="text" name="display">
                </div>
                <div>
                    <input type="button" value="AC" onclick="display.value = ''">
                    <input type="button" value="DEL" onclick="display.value = display.value.slice(0,-1)">
                    <input type="button" value="." onclick="display.value +='.'">
                    <input type="button" value="/" onclick="display.value +='/'">
                </div>
                <div>
                    <input type="button" value="7" onclick="display.value +='7'">
                    <input type="button" value="8" onclick="display.value +='8'">
                    <input type="button" value="9" onclick="display.value +='9'">
                    <input type="button" value="*" onclick="display.value +='*'">
                </div>
                <div>
                    <input type="button" value="4" onclick="display.value +='4'">
                    <input type="button" value="5" onclick="display.value +='5'">
                    <input type="button" value="6" onclick="display.value +='6'">
                    <input type="button" value="-" onclick="display.value +='-'">
                </div>
                <div>
                    <input type="button" value="1" onclick="display.value +='1'">
                    <input type="button" value="2" onclick="display.value +='2'">
                    <input type="button" value="3" onclick="display.value +='3'">
                    <input type="button" value="+" onclick="display.value +='+'">
                </div>
                <div>
                    <input type="button" value="00" onclick="display.value +='00'">
                    <input type="button" value="0" onclick="display.value +='0'">
                    <input type="button" value="=" onclick="display.value = eval(display.value)" class="equal">
                </div>
            </form>

        </div>
    </div>
    
</body>
</html>
